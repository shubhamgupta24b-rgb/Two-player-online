<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Room lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFC93C}a:hover{color:#FFE08A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, #151A4A 0%, #0B0E2E 45%, #060820 100%); font-family: 'Nunito', system-ui, sans-serif; color: #FFFFFF; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button style="height: 40px; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,94,91,0.5); background: transparent; color: #FF8E8B; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900">Leave</button>
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.16em; color: #AAB2E8">GAME ROOM</span>
    <div style="width: 66px"></div>
  </div>

  <div style="border-radius: 22px; padding: 16px; background: linear-gradient(135deg, #3B2D9A, #1F1666); border: 1px solid rgba(255,255,255,0.14); display: flex; flex-direction: column; align-items: center; gap: 10px">
    <span style="font-size: 11px; font-weight: 900; letter-spacing: 0.16em; color: #E9C46A">ROOM CODE</span>
    <div style="display: flex; gap: 6px">
      <span style="width: 42px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 32px">K</span>
      <span style="width: 42px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 32px">7</span>
      <span style="width: 42px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 32px">Q</span>
      <span style="width: 42px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 32px">2</span>
      <span style="width: 42px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 32px">P</span>
      <span style="width: 42px; height: 52px; border-radius: 10px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 32px">X</span>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 40px; padding: 0 14px; border-radius: 14px; border: none; background: rgba(255,255,255,0.14); color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="2"></rect><path d="M11 5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h2"></path></svg>Copy</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 14px; border: none; background: rgba(255,255,255,0.14); color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="3.5" r="2"></circle><circle cx="4" cy="8" r="2"></circle><circle cx="12" cy="12.5" r="2"></circle><path d="M6 7l4-2.5M6 9l4 2.5"></path></svg>Share</button>
    </div>
    <span style="font-size: 12px; font-weight: 800; color: #D6DAF7; text-align: center">Friends tap Join room and enter this code</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 13px; font-weight: 900; letter-spacing: 0.14em">PLAYERS · 3 / 4</span>
    <span style="font-size: 12px; font-weight: 800; color: #C3C9EE">2 ready</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border-radius: 16px; background: rgba(46,139,255,0.14); border: 1.5px solid rgba(46,139,255,0.6)">
      <span style="width: 26px; height: 26px; border-radius: 13px; background: #2E8BFF; display: flex; align-items: center; justify-content: center; font-family: 'Lilita One', sans-serif; font-size: 14px">A</span>
      <span style="flex: 1; font-size: 15px; font-weight: 900">Aarav <span style="font-size: 11px; color: #9CC9FF">YOU · HOST</span></span>
      <svg width="18" height="16" viewBox="0 0 18 16" aria-label="Host"><path d="M1 13L3 4l4 4 2-6 2 6 4-4 2 9z" fill="#FFC93C"></path></svg>
      <span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; background: rgba(46,204,113,0.2); color: #B5F0CD">READY</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.10)">
      <span style="width: 26px; height: 26px; display: flex; align-items: center; justify-content: center"><span style="width: 19px; height: 19px; background: #FF8A1F; border-radius: 4px; transform: rotate(45deg); display: inline-block"></span></span>
      <span style="flex: 1; font-size: 15px; font-weight: 900">Meera</span>
      <span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; background: rgba(46,204,113,0.2); color: #B5F0CD">READY</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border-radius: 16px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.10)">
      <svg width="26" height="24" viewBox="0 0 26 24" aria-hidden="true"><polygon points="13,2 24,22 2,22" fill="#2ECC71" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"></polygon></svg>
      <span style="flex: 1; font-size: 15px; font-weight: 900">Rohan</span>
      <span style="font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; background: rgba(255,255,255,0.10); color: #C3C9EE">NOT READY</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 12px; border-radius: 16px; border: 1.5px dashed rgba(255,255,255,0.22)">
      <span style="width: 26px; height: 26px; border-radius: 6px; border: 1.5px dashed rgba(176,124,255,0.7)"></span>
      <span style="flex: 1; font-size: 14px; font-weight: 800; color: #C3C9EE">Waiting for a player…</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10)">
    <svg width="64" height="54" viewBox="0 0 64 54" aria-hidden="true"><rect width="64" height="54" rx="10" fill="#0D4A41"></rect><g transform="rotate(-10 26 27)"><rect x="12" y="8" width="26" height="38" rx="5" fill="#FFF8EC"></rect><g fill="#7E57C2"><circle cx="22" cy="24" r="3.5"></circle><circle cx="29" cy="24" r="3.5"></circle><circle cx="25.5" cy="30" r="3.5"></circle></g></g><g transform="rotate(10 40 27)"><rect x="28" y="9" width="26" height="38" rx="5" fill="#FFF8EC"></rect><rect x="30" y="11" width="22" height="34" rx="4" fill="#2A1F7A"></rect></g></svg>
    <div style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 11px; font-weight: 900; letter-spacing: 0.14em; color: #AAB2E8">NEXT GAME</span><span style="font-family: 'Lilita One', sans-serif; font-size: 20px">Memory</span></div>
    <button style="height: 40px; padding: 0 14px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.28); background: transparent; color: #FFFFFF; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 900">Change</button>
  </div>

  <div style="flex: 1"></div>
  <span style="text-align: center; font-size: 13px; font-weight: 800; color: #C3C9EE">Waiting for Rohan to tap Ready…</span>
  <button style="height: 58px; border-radius: 18px; border: none; background: rgba(255,201,60,0.35); color: rgba(26,20,64,0.75); font-family: 'Lilita One', sans-serif; font-size: 24px">Start game</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
