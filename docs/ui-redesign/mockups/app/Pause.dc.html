      <div style="display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.08)">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z"></path><path d="M13 7a4 4 0 0 1 0 6M15.5 4.5a8 8 0 0 1 0 11"></path></svg>

        <span style="flex: 1; font-size: 15px; font-weight: 900">Vibration</span>
