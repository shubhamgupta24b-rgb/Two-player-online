services:
  - type: web
    name: two-player-online-server
    env: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: firebase
      - key: RECONNECT_GRACE_MS
        value: 60000
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ALLOW_DEV_AUTH
        sync: false
