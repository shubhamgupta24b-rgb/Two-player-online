name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/clay-games-ui-uno
    paths:
      - "mobile/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      # Diagnose Android toolchain first, even if unrelated Dart tests fail.
      - name: Verify Android Gradle wrapper
        working-directory: mobile
        run: |
          cat android/gradle/wrapper/gradle-wrapper.properties
          cd android
          chmod +x gradlew
          ./gradlew --version
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --no-pub
      - name: Analyze Dart sources
        working-directory: mobile
        run: flutter analyze --no-pub
        continue-on-error: true
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=APP_STYLE=flat
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: two-player-online-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
