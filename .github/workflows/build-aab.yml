name: Build Android AAB
# Signed .aab for the Play Store. Needs these repo secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of upload-keystore.jks (base64 -w0 upload-keystore.jks)
#   ANDROID_KEYSTORE_PASSWORD storePassword from key.properties
#   ANDROID_KEY_ALIAS         keyAlias from key.properties
#   ANDROID_KEY_PASSWORD      keyPassword from key.properties
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL the app connects to (e.g. https://my-game.onrender.com)'
        required: true
      app_style:
        description: 'Which app to build'
        type: choice
        options: [default, flat]
        default: default
      build_number:
        description: 'versionCode (must be higher than the last upload; blank = pubspec.yaml)'
        required: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Set up signing key
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Without the key, Gradle would quietly sign with the debug key, which Play rejects.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets missing, see the top of build-aab.yml"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > key.properties <<EOF
          storeFile=$PWD/upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build AAB
        working-directory: mobile
        run: |
          ARGS="--release --dart-define=SERVER_URL=${{ inputs.server_url }}"
          if [ "${{ inputs.app_style }}" = "flat" ]; then ARGS="$ARGS --dart-define=APP_STYLE=flat"; fi
          if [ -n "${{ inputs.build_number }}" ]; then ARGS="$ARGS --build-number=${{ inputs.build_number }}"; fi
          flutter pub get
          flutter build appbundle $ARGS
      - name: Remove signing key
        if: always()
        working-directory: mobile/android
        run: rm -f upload-keystore.jks key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: party-games-${{ inputs.app_style }}-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
