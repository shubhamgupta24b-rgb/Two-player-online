name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server URL the app connects to (e.g. https://my-game.onrender.com)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org com.example.partygames . && flutter pub get
      - name: Allow internet and http for testing
        working-directory: mobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $M
      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=SERVER_URL=${{ inputs.server_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: party-games-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
