name: Build Android APK

on:
  push:
    branches:
      - feature/memory-game
    paths:
      - "mobile/**"
      - "server/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server URL the app connects to"
        required: false
        default: "https://two-player-online.onrender.com"

permissions:
  contents: read

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run server tests
        working-directory: server
        run: npm install && node --test tests/memory.test.js tests/rooms.test.js

  build:
    needs: test-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --org com.example.partygames . && flutter pub get
      - name: Allow internet and HTTP for testing
        working-directory: mobile
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$M"
      - name: Analyze Flutter app
        working-directory: mobile
        run: flutter analyze lib/games/memory/memory_screen.dart lib/features/create_room/create_room_screen.dart lib/core/room/room_manager.dart
      - name: Build release APK
        working-directory: mobile
        env:
          SERVER_URL: ${{ inputs.server_url || 'https://two-player-online.onrender.com' }}
        run: flutter build apk --release --dart-define=SERVER_URL="$SERVER_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: rivalrooms-memory-feature-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
