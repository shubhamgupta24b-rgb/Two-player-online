name: multiplayer_game
description: Online multiplayer mini-game platform.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.3
  flutter_svg: ^2.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/start/start_table.jpg
    - assets/start/air_hockey.jpg
    - assets/game_icons/
  # Bundled OFL fonts (licences in assets/fonts/OFL-*.txt). Nunito static weights come from
  # Fontsource's build of the Google Fonts family (Latin subset).
  fonts:
    - family: Lilita One
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
